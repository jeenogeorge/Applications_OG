# Scenario Name 
scenario: "BASELINEEthiopia"
# for KTEHighDemandNointerconnection, make crossborderTrade: False transmission_planned: False and comment out 
# any user_defined_capacity_transmission: after 2025 - change exiting user defined transimission first year of expansion from 2026 to 2025 and builr rate from 1 to 0
# have to do it country wise (****above way did not work****)

# for country wise - comment out the other counties  and keep the country that is being modelled eg: ken; make crossborderTrade: False transmission_planned: False and comment out 
# any user_defined_capacity_transmission: after 2025 - change exiting user defined transimission final year of expansion from 2050 to 2025 and built rate from 1 to 0, etc
#  like -> trn1: [TRNTZAXXKENXX, 2, 2025, 2025, 2025, 0, 350, 13, 4, 95]
# IMPORTANT - for uganda - remove urn from no_invest technologoes


# Temporal Parameters 
startYear: 2022
endYear: 2050
daytype: False
dayparts:
# daypart : [start_hour (inclusive), end_hour (exclusive)]
  D1: [1, 5]
  D2: [5, 9]
  D3: [9, 13]
  D4: [13, 17]
  D5: [17, 21]
  D6: [21, 25]
seasons:
# season : [month 1, month 2, ...] (all inclusive)
  S1: [1, 2, 3, 4]
  S2: [5, 6, 7, 8]
  S3: [9, 10, 11, 12]

timeshift: 3 # value between -11 and 12
  
# Spatial Parameters 
geographic_scope:
  #- "KEN"
  #- "TZA"
  - "ETH"
  #- "UGA"

# Set to True if transmission should be included
crossborderTrade: False

# Set to True if existing transmission capacities should be included
# from the Global Transmission Database (Brinkerink et al., 2024).
transmission_existing: True

# Set to True if planned transmission capacities should be included
# from the Global Transmission Database (Brinkerink et al., 2024).
transmission_planned: False


# Set to True if existing storage capacities should be included
# from the Global Energy Storage Database (DOE/Sandia).
# If custom nodes are defined in 'nodes_to_add' and you want to assign
# GESDB data to custom nodes you'll have to update 'GESDB_region_mapping'
# in 'resources/data/custom'.
storage_existing: True

# Set to True if planned storage capacities should be included
# from the Global Energy Storage Database (DOE/Sandia).
# If custom nodes are defined in 'nodes_to_add' and you want to assign
# GESDB data to custom nodes you'll have to update 'GESDB_region_mapping'
# in 'resources/data/custom'.
storage_planned: True

# Emission Parameters 
emission_penalty: 
# - [EMISSION, COUNTRY, START_YEAR, END_YEAR, VALUE]
# EXAMPLE:  - ["CO2", "IND", 2020, 2050, 2.1]
# where VALUE is in M$/MT CO2

# Investment Parameters 
no_invest_technologies: 
  - "OTH"
  - "COG" 
  - "PET"
  - "COA"
  - "OCG"
  - "OIL"
  - "URN"
  - "WOF"
  - "CCG"
  - "WAV"

# Result Parameters 
results_by_country: True

# solver parameters
solver: "gurobi" # cbc, cplex, gurobi

user_defined_capacity:
# technology: [capacity, 
#              build_year, 
#              first_year_of_expansion, 
#              build_rate_per_year, 
#              capex_cost, 
#              efficiency]
# EXAMPLE:  PWRCOAINDWE01: [8, 2000, 2025, 5, 1100, 35]
# Units are in GW (capacity/build_rate_per_year), m$/GW (capex_cost), 
# % (efficiency).
  PWRSPVKENXX01: [.4, 2026, 2028, 5, 800, 33]
  PWRSPVTZAXX01: [.15, 2026, 2028, 5, 800, 33]
  PWRSPVETHXX01: [.10, 2026, 2028, 5, 800, 33]
  PWRBIOUGAXX01: [.01, 2010, 2022, 0.001, 800, 33]
  PWRSPVUGAXX01: [.06, 2015, 2022, 0.001, 800, 33]
  PWRHYDTZAXX01: [.08, 2022, 2030, 3, 800, 90]
  PWRHYDKENXX01: [.025, 2022, 2030, 1, 800, 90]
  #PWRHYDUGAXX01: [.1, 2022, 2030, 1, 800, 90]
  #PWROILTZAXX01: [.01, 1990, 2022, 0, 3800, 33]
  #PWRHYDUGAXX01: [.7, 2023, 2030, 1, 800, 33]
  #PWROILUGAXX01: [.01, 2000, 2022, 0.001, 800, 33]
  #PWRURNKENXX01: [2, 2040, 2040, 0, 8000, 40]
  #PWRURNTZAXX01: [2, 2040, 2040, 0, 8000, 40]
  #PWRURNETHXX01: [2, 2040, 2040, 0, 8000, 40]

user_defined_capacity_transmission:
# entry: [technology,
#         capacity, 
#         build_year, 
#         first_year_of_expansion, 
#         final_year_of_expansion,   
#         build_rate_per_year, 
#         capex_cost,
#         annual_fixed_O&M_cost,
#         variable_O&M_cost,
#         efficiency]
# EXAMPLE:  trn1: [TRNINDEAINDNE, 5, 1975, 2025, 2025, 0, 350, 13, 4, 95]
# Per technology, only the capacity, build_year, first_year_of_expansion, 
# final_year_of_expansion and build_rate_per_year parameters can deviate
# from each other. For all other parameters only the last entry will be used.
  trn1: [TRNTZAXXKENXX, 2, 2025, 2025, 2025, 0, 350, 13, 4, 95]
  trn2: [TRNKENXXTZAXX, 2, 2025, 2025, 2025, 0, 350, 13, 4, 95]
  trn3: [TRNETHXXKENXX, .2, 2010, 2025, 2025, 0, 350, 13, 4, 95]
  trn4: [TRNKENXXETHXX, .2, 2010, 2025, 2025, 0, 350, 13, 4, 95]
  trn5: [TRNUGAXXTZAXX, .2, 2010, 2026, 2050, 0, 350, 13, 4, 95]
  trn6: [TRNTZAXXUGAXX, .2, 2010, 2026, 2050, 0, 350, 13, 4, 95]
  trn7: [TRNKENXXUGAXX, .1, 2010, 2026, 2050, 0, 350, 13, 4, 95]
  trn8: [TRNUGAXXKENXX, .1, 2010, 2026, 2050, 0, 350, 13, 4, 95]
